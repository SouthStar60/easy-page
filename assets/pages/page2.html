<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>占位文章</title>
</head>
<body>
    <div class="article-page">
        <h1>占位文章</h1>
        <p>这是一篇无意义的占位文章，用于演示文档系统的布局与样式。</p>

        <h2>标题层级</h2>
        <h3>三级标题</h3>
        <h4>四级标题</h4>

        <h2>段落与文本</h2>
        <p>普通段落文本，包含 <strong>加粗</strong>、<em>斜体</em>、<a href="#">链接</a> 和 <code>行内代码</code>。</p>
        <blockquote>引用块：这是一段引用文字。</blockquote>

        <h2>列表</h2>
        <ul>
            <li>无序列表项 1</li>
            <li>无序列表项 2</li>
        </ul>
        <ol>
            <li>有序列表项 1</li>
            <li>有序列表项 2</li>
        </ol>

        <h2>代码块</h2>
        <pre><code class="language-javascript">
// 简单示例
function hello() {
    console.log('Hello, world!');
}
hello();
        </code></pre>

        <h2>表格</h2>
        <table style="width:100%; border-collapse:collapse; color:#e8e8e8;">
            <thead>
                <tr><th style="border:1px solid #444; padding:6px;">列1</th><th style="border:1px solid #444; padding:6px;">列2</th></tr>
            </thead>
            <tbody>
                <tr><td style="border:1px solid #444; padding:6px;">数据A</td><td style="border:1px solid #444; padding:6px;">数据B</td></tr>
                <tr><td style="border:1px solid #444; padding:6px;">数据C</td><td style="border:1px solid #444; padding:6px;">数据D</td></tr>
            </tbody>
        </table>

        <hr />

        <p>以上就是全部占位内容。您可以复制此文件用作其他文章模板。</p>
    </div>

    <script>
        window.initArticle = function() {
            console.log('占位文章已加载');
        };
    </script>
</body>
</html>
